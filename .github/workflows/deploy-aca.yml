name: Deploy to Azure Container Apps

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

env:
  IMAGE_NAME: discord-bot

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Install containerapp extension
        run: az extension add --name containerapp --upgrade

      - name: Build image in ACR
        run: |
          az acr build \
            -r "${{ vars.AZURE_ACR_NAME }}" \
            -t "${{ env.IMAGE_NAME }}:${{ github.sha }}" \
            .

      - name: Get ACR login server
        id: acr
        run: |
          LOGIN_SERVER=$(az acr show -n "${{ vars.AZURE_ACR_NAME }}" --query loginServer -o tsv)
          echo "login_server=$LOGIN_SERVER" >> "$GITHUB_OUTPUT"

      - name: Create or update Container App
        run: |
          az containerapp up \
            -n "${{ vars.AZURE_CONTAINER_APP_NAME }}" \
            -g "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --environment "${{ vars.AZURE_CONTAINERAPPS_ENV }}" \
            --image "${{ steps.acr.outputs.login_server }}/${{ env.IMAGE_NAME }}:${{ github.sha }}" \

      - name: Set secrets
        run: |
          az containerapp secret set \
            -n "${{ vars.AZURE_CONTAINER_APP_NAME }}" \
            -g "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --secrets \
            DISCORD_TOKEN="${{ secrets.DISCORD_TOKEN }}" \
            TWITCH_CLIENT_ID="${{ secrets.TWITCH_CLIENT_ID }}" \
            TWITCH_CLIENT_SECRET="${{ secrets.TWITCH_CLIENT_SECRET }}" \
            NOTIF_CHANNEL_ID="${{ secrets.NOTIF_CHANNEL_ID }}" \
            SOCIALS_CHANNEL_ID="${{ secrets.SOCIALS_CHANNEL_ID }}" \
            GUILD_ID="${{ secrets.GUILD_ID }}"

      - name: Bind env vars
        run: |
          az containerapp update \
            -n "${{ vars.AZURE_CONTAINER_APP_NAME }}" \
            -g "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --set-env-vars \
            DISCORD_TOKEN=secretref:DISCORD_TOKEN \
            TWITCH_CLIENT_ID=secretref:TWITCH_CLIENT_ID \
            TWITCH_CLIENT_SECRET=secretref:TWITCH_CLIENT_SECRET \
            NOTIF_CHANNEL_ID=secretref:NOTIF_CHANNEL_ID \
            SOCIALS_CHANNEL_ID=secretref:SOCIALS_CHANNEL_ID \
            GUILD_ID=secretref:GUILD_ID
