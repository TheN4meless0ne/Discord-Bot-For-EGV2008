# Paste into TrueNAS: Apps > Discover Apps > ⋮ > Install via YAML.
# Before installing:
#   1. Create a dataset for the bot's data, e.g. egv-fs-001/apps/discord-bot,
#      owned by apps (568:568). Use POSIX ACLs, not NFSv4.
#   2. Fill in the values below. They are stored in the app config on TrueNAS.

services:
  discord-bot:
    image: ghcr.io/then4meless0ne/discord-bot-for-egv2008:latest
    pull_policy: always
    restart: unless-stopped
    user: "568:568"
    environment:
      DISCORD_TOKEN: "changeme"
      TWITCH_CLIENT_ID: "changeme"
      TWITCH_CLIENT_SECRET: "changeme"
      NOTIF_CHANNEL_ID: "changeme"
      SOCIALS_CHANNEL_ID: "changeme"
      GUILD_ID: "changeme"
      TZ: "Europe/Oslo"
    volumes:
      - /mnt/egv-fs-001/apps/discord-bot:/data
    labels:
      com.centurylinklabs.watchtower.enable: "true"

  # Optional: auto-update the bot when a new image lands on GHCR.
  # Uses the maintained fork (the original containrrr/watchtower is archived).
  # Only containers with the label above are touched.
  # Remove this service if you'd rather update manually from the TrueNAS UI.
  watchtower:
    image: nickfedor/watchtower:latest
    restart: unless-stopped
    environment:
      WATCHTOWER_LABEL_ENABLE: "true"
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_POLL_INTERVAL: "300"
      TZ: "Europe/Oslo"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
